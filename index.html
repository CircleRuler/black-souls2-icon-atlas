<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACK SOULS II · 图标对照表</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e4e7ec;--text:#1a1d21;--muted:#687076;--accent:#3b5bdb;
  --state:#7048e8;--item:#0ca678;--weapon:#e03131;--armor:#e8590c;--skill:#1c7ed6;--bad:#c92a2a}
*{box-sizing:border-box}
body{margin:0;padding:0 20px 70px;background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
header{padding:18px 0 0}
h1{font-size:17px;margin:0 0 3px;font-weight:650;letter-spacing:.2px}
.sub{color:var(--muted);font-size:12.5px;margin:0}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 0;font-size:12px;color:var(--muted)}
.stats b{color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:9;background:var(--bg);padding:11px 0 10px;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
input{width:220px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;
  background:#fff;color:var(--text);outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.1)}
button{padding:6px 12px;border:1px solid var(--line);background:#fff;color:var(--text);
  border-radius:8px;cursor:pointer;font-size:12.5px;transition:all .12s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{border-color:var(--accent);color:#fff;background:var(--accent)}
button.on.k-state{background:var(--state);border-color:var(--state)}
button.on.k-item{background:var(--item);border-color:var(--item)}
button.on.k-weapon{background:var(--weapon);border-color:var(--weapon)}
button.on.k-armor{background:var(--armor);border-color:var(--armor)}
button.on.k-skill{background:var(--skill);border-color:var(--skill)}
.hint{font-size:12px;color:var(--muted);margin-left:2px}
.grid{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:5px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:4px 2px 3px;
  text-align:center;position:relative;transition:border-color .1s,box-shadow .1s,opacity .1s}
.cell:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(59,91,219,.15);z-index:2}
.cell.hit{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,91,219,.35)}
.cell.dim{opacity:.14}
.cell.collapsed{display:none}
.cell.blank{border-style:dashed;background:#fff5f5}
.cell.blank .sprite{opacity:.12}

.sprite{width:48px;height:48px;margin:0 auto;image-rendering:pixelated;
  background-image:var(--iconset);background-size:var(--bgsize)}
.idx{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.nm{font-size:10px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:600;padding:0 1px}

.nm.k-skill{color:var(--skill)}

.tip .th{color:#ffd43b;font-weight:650;font-size:13px;margin-bottom:2px}

.msub{font-size:12px;color:var(--muted);margin-top:2px}

.ed{font-size:12.5px;color:#4a5259;line-height:1.62;margin-top:3px;white-space:pre-line}
.est{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

.chip.mp{background:#e7f5ff;color:#1971c2}
.chip.scope{background:#f3f0ff;color:#6741d9}
.chip.fx{background:#fff4e6;color:#d9480f}
.chip.param{background:#e7f5ff;color:#1971c2}
.chip.price{background:#f8f9fa;color:#868e96;font-weight:500}

const BLANK=new Set([0, 141, 142, 608, 623, 670, 681, 697, 728, 784, 785, 786, 787, 788, 789, 790, 791, 799, 800, 801, 802, 803, 804, 805, 806, 809, 820, 821, 822, 823, 828, 836, 837, 838, 839, 843, 844, 845, 846, 847, 848, 849, 850, 851, 852, 853, 854, 855, 856, 857, 858, 859, 860, 861, 862, 863]);
const KIND={state:'状态',item:'物品',weapon:'武器',armor:'防具',skill:'技能'};
const grid=document.getElementById('grid'),floater=document.getElementById('floater');
let kinds=new Set(['all']),onlyUsed=true,hits=new Set();
for(let i=0;i<TOTAL;i++){
  const x=(i%COLS)*CELL*SCALE,y=Math.floor(i/COLS)*CELL*SCALE;
  const m=META[i];
  const d=document.createElement('div');
  d.className='cell'+(BLANK.has(i)?' blank':'');
  d.dataset.i=i;
  d.dataset.blank=BLANK.has(i)?'1':'0';
  d.dataset.kinds=m?m.kinds.join(','):'';
  d.dataset.text=m?m.items.map(x=>x.n+' '+x.d).join(' ').toLowerCase():'';
  d.innerHTML='<div class="sprite" style="background-position:-'+x+'px -'+y+'px"></div>'
    +'<div class="idx">'+i+'</div>'
    +(m?'<div class="nm k-'+m.kinds[0]+'">'+m.label+'</div>':'')
    +(m&&m.blank?'<span class="badge">✕</span>':'');
  if(m){
    d.addEventListener('mouseenter',()=>{
      const MAXL=14;
      const shown=m.items.slice(0,MAXL);
      const more=m.items.length-shown.length;
      const lines=shown.map(x=>'['+KIND[x.k]+'] '+x.n+(x.d?'\n    '+x.d:''));
      if(more>0)lines.push('…… 还有 '+more+' 条');
      floater.innerHTML='<div class="th">#'+i+(m.blank?'　⚠ 图集里是空白格':'')+'　共 '+m.items.length+' 条</div>'+lines.join('\n');
      floater.classList.add('show');
    });
    d.addEventListener('mousemove',e=>{
      floater.style.left=Math.min(e.clientX+14,innerWidth-460)+'px';
      floater.style.top=Math.max(8,Math.min(e.clientY+16,innerHeight-240))+'px';
    });
    d.addEventListener('mouseleave',()=>floater.classList.remove('show'));
    d.addEventListener('click',()=>openModal(i));
    d.style.cursor='pointer';
  }
  grid.appendChild(d);
}
function evalCell(c){
  const i=+c.dataset.i,m=META[i];
  if(hits.size)return{show:hits.has(i),dim:!hits.has(i)};
  if(onlyUsed&&!m)return{show:false,dim:false};
  if(!kinds.has('all')){
    const ks=(c.dataset.kinds||'').split(',');
    return{show:true,dim:!ks.some(k=>kinds.has(k))};
  }
  return{show:true,dim:false};
}
function apply(){
  let shown=0,folded=0;
  document.querySelectorAll('.cell').forEach(c=>{
    const r=evalCell(c);
    c.classList.toggle('collapsed',!r.show);
    c.classList.toggle('dim',r.show&&r.dim);
    c.classList.toggle('hit',hits.has(+c.dataset.i));
    if(r.show)shown++;else folded++;
  });
  document.getElementById('hint').textContent='显示 '+shown+' / '+TOTAL+' 格'+(folded?'　已折叠 '+folded+' 个未使用':'');
}
function setKind(k,btn){
  document.querySelectorAll('.kf').forEach(b=>b.classList.toggle('on',b===btn));
  kinds=new Set([k]);
  apply();
}
function toggleOnly(btn){onlyUsed=!onlyUsed;btn.classList.toggle('on',onlyUsed);apply();}
function search(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  hits=new Set();
  if(q){
    if(/^\d+$/.test(q)){
      const n=parseInt(q,10);
      if(n<TOTAL)hits.add(n);
      const el=document.querySelector('.cell[data-i="'+n+'"]');
      if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
    }else{
      document.querySelectorAll('.cell').forEach(c=>{
        if(c.dataset.text&&c.dataset.text.indexOf(q)>=0)hits.add(+c.dataset.i);
      });
      const f=hits.size?document.querySelector('.cell[data-i="'+[...hits][0]+'"]'):null;
      if(f)f.scrollIntoView({block:'center',behavior:'smooth'});
    }
  }
  apply();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function openModal(i){
  const m=META[i];if(!m)return;
  floater.classList.remove('show');
  const x=(i%COLS)*CELL*SCALE,y=Math.floor(i/COLS)*CELL*SCALE;
  document.getElementById('mIcon').style.backgroundPosition='-'+x+'px -'+y+'px';
  document.getElementById('mTitle').textContent='#'+i+'　'+m.label;
  document.getElementById('mSub').textContent=m.items.length+' 条数据'+(m.blank?'　⚠ 图集里是空白格':'');
  const order=['state','skill','item','weapon','armor'],groups={};
  m.items.forEach(x=>{(groups[x.k]=groups[x.k]||[]).push(x);});
  const body=document.getElementById('mBody');
  body.innerHTML='';
  order.forEach(k=>{
    const arr=groups[k];if(!arr||!arr.length)return;
    const g=document.createElement('div');g.className='grp';
    const h=document.createElement('div');h.className='gh k-'+k;h.textContent=KIND[k]+'　'+arr.length+' 条';
    g.appendChild(h);
    arr.forEach(it=>{
      const e=document.createElement('div');e.className='entry';
      let html='<div class="en">'+esc(it.n)+'</div>'+(it.d?'<div class="ed">'+esc(it.d)+'</div>':'');
      const s=it.s;
      if(s){
        const chips=[];
        if(s.mp)chips.push(['mp','MP '+s.mp]);
        if(s.tp)chips.push(['mp','TP '+s.tp]);
        if(s.scope)chips.push(['scope',s.scope]);
        if(s.hit!=null&&s.hit!==100)chips.push(['','命中 '+s.hit+'%']);
        if(s.hit_type&&s.hit_type!=='必中')chips.push(['',s.hit_type]);
        if(s.repeats)chips.push(['','×'+s.repeats]);
        if(s.speed)chips.push(['','速度'+(s.speed>0?'+':'')+s.speed]);
        if(s.occasion&&s.occasion!=='仅战斗'&&s.occasion!=='随时')chips.push(['',s.occasion]);
        if(s.restriction)chips.push(['warn',s.restriction]);
        if(s.turns)chips.push(['',s.turns]);
        if(s.auto)chips.push(['',s.auto]);
        if(s.walk)chips.push(['',s.walk]);
        if(s.dmg_remove)chips.push(['',s.dmg_remove]);
        if(s.battle_end)chips.push(['',s.battle_end]);
        (s.params||[]).forEach(x=>chips.push(['param',x]));
        (s.features||[]).forEach(x=>chips.push(['fx',x]));
        if(s.etype)chips.push(['','['+s.etype+']']);
        (s.effects||[]).forEach(x=>chips.push(['fx',x]));
        (s.tags||[]).forEach(x=>chips.push(['param',x]));
        if(s.keep)chips.push(['',s.keep]);
        if(s.price)chips.push(['price',s.price+' 魂']);
        if(chips.length)html+='<div class="est">'+chips.map(c=>'<span class="chip '+c[0]+'">'+esc(c[1])+'</span>').join('')+'</div>';
        if(s.damage){
          const d=s.damage;
          let t=d.type;
          if(d.formula)t+=' · '+d.formula;
          if(d.variance)t+=' · 浮动 '+d.variance+'%';
          if(d.critical)t+=' · 可暴击';
          html+='<div class="edmg">'+esc(t)+'</div>';
        }
      }
      e.innerHTML=html;
      g.appendChild(e);
    });
    body.appendChild(g);
  });
  document.getElementById('modal').classList.add('show');
  body.scrollTop=0;
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
document.getElementById('q').addEventListener('input',()=>{if(!document.getElementById('q').value)search();});
apply();
</script>
